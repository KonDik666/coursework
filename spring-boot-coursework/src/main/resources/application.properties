spring.datasource.url=jdbc:h2:./testdb/purchases
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.info.env.enabled=true
info.app.name=PurchaseManagement
info.app.description=Purchases and shops coursework
info.app.version=1.0
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123!}
app.admin.enabled=true
