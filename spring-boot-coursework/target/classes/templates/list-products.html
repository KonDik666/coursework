<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Покупки')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container pb-4">
<h1>Покупки</h1>
<div th:replace="~{fragments :: messages}"></div>
<p th:if="${ownRecordsOnly}">Показаны только ваши покупки.</p>
<p th:unless="${isWriter}">Режим просмотра: READ_ONLY.</p>
<a th:if="${isWriter}" th:href="@{/addProductForm}" class="btn btn-primary mb-3">Добавить покупку</a>
<div class="table-scroll"><table class="table table-bordered table-striped"><thead><tr><th>Название</th><th>Цена, руб.</th><th>Количество</th><th>Стоимость, руб.</th><th>Магазин</th><th>Создал</th><th th:if="${isWriter}">Действия</th></tr></thead>
<tbody><tr th:each="product : ${products}">
    <td th:text="${product.name}"></td><td th:text="${product.price}"></td><td th:text="${product.quantity}"></td>
    <td th:text="${product.cost}"></td><td th:text="${product.shop.name}"></td><td th:text="${product.owner.username}"></td>
    <td th:if="${isWriter}"><div class="d-flex gap-2">
        <a th:href="@{/showProductUpdateForm(productId=${product.id})}" class="btn btn-info btn-sm">Изменить</a>
        <form th:action="@{/deleteProduct}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><button class="btn btn-danger btn-sm">Удалить</button></form>
    </div></td>
</tr></tbody></table></div><p class="empty-state" th:if="${#lists.isEmpty(products)}">Покупок пока нет.</p>
<p class="total-strip"><strong>Итого по доступным покупкам: <span id="total" th:text="${total}"></span> руб.</strong></p>
</main>
</body>
</html>
