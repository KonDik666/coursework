<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Магазины')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container pb-4">
<h1>Магазины</h1>
<div th:replace="~{fragments :: messages}"></div>
<p th:if="${ownRecordsOnly}">Показаны только ваши магазины.</p>
<p th:unless="${isWriter}">Режим просмотра: READ_ONLY.</p>
<a th:if="${isWriter}" th:href="@{/addShopForm}" class="btn btn-primary mb-3">Добавить магазин</a>
<div class="table-scroll"><table class="table table-bordered table-striped"><thead><tr><th>Название</th><th>Адрес</th><th>Создал</th><th th:if="${isWriter}">Действия</th></tr></thead>
<tbody><tr th:each="shop : ${shops}">
    <td th:text="${shop.name}"></td><td th:text="${shop.address}"></td><td th:text="${shop.owner.username}"></td>
    <td th:if="${isWriter}"><div class="d-flex gap-2">
        <a th:href="@{/showShopUpdateForm(shopId=${shop.id})}" class="btn btn-info btn-sm">Изменить</a>
        <form th:action="@{/deleteShop}" method="post"><input type="hidden" name="shopId" th:value="${shop.id}"><button class="btn btn-danger btn-sm">Удалить</button></form>
    </div></td>
</tr></tbody></table></div><p class="empty-state" th:if="${#lists.isEmpty(shops)}">Магазинов пока нет.</p>
</main>
</body>
</html>
